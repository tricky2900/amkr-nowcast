# Series registry. Single source of truth for what gets pulled and how it is grouped.
# Add or remove entries here; the pipeline reads this file, no code changes needed.

taiwan_companies:
  - {series_id: TSMC,    ticker: "2330", name: "TSMC",                  currency: TWD, group: foundry}
  - {series_id: ASE,     ticker: "3711", name: "ASE Technology",        currency: TWD, group: osat, note: "Consolidated incl. USI EMS - dilutes pure OSAT signal"}
  - {series_id: KYEC,    ticker: "2449", name: "King Yuan Electronics", currency: TWD, group: osat, note: "Test-heavy"}
  - {series_id: CHIPMOS, ticker: "8150", name: "ChipMOS",               currency: TWD, group: osat, note: "Memory / display driver skew"}
  - {series_id: PTI,     ticker: "6239", name: "Powertech Technology",  currency: TWD, group: osat, note: "Memory skew"}

# Revenue-weighted OSAT composite. Weights recomputed from trailing 12m revenue
# each time the master is rebuilt, unless static_weights is true.
osat_composite:
  members: [ASE, KYEC, CHIPMOS, PTI]
  static_weights: false
  # Cap any single member's weight. Uncapped, ASE takes ~82% of the composite on
  # revenue weighting and the "composite" is really just ASE - including its USI
  # EMS business, which is not OSAT at all. Capping keeps the pure-play testers
  # (KYEC, PTI, ChipMOS) actually contributing signal. Set to 1.0 to disable.
  max_weight: 0.45

sia_regions:
  - {series_id: SIA_GLOBAL,   name: "SIA Global Billings"}
  - {series_id: SIA_AMERICAS, name: "SIA Americas"}
  - {series_id: SIA_EUROPE,   name: "SIA Europe"}
  - {series_id: SIA_JAPAN,    name: "SIA Japan"}
  - {series_id: SIA_CHINA,    name: "SIA China"}
  - {series_id: SIA_APAC,     name: "SIA APAC/Other"}

taiwan_exports:
  - {series_id: TWEX_TOTAL,      name: "Total Exports"}
  - {series_id: TWEX_MACH_ELEC,  name: "Machinery & Electrical Equipment"}
  - {series_id: TWEX_ELEC_PARTS, name: "Electronic Product Parts"}
  - {series_id: TWEX_MACHINERY,  name: "Machinery"}
  - {series_id: TWEX_ELEC_MACH,  name: "Electrical Machinery Products"}
  - {series_id: TWEX_ICT_AV,     name: "ICT & Audio-Video Products"}
  - {series_id: TWEX_APPLIANCES, name: "Domestic Appliances"}
  - {series_id: TWEX_ELEC_ICT,   name: "Electronic + ICT Exports", derived: "TWEX_ELEC_PARTS + TWEX_ICT_AV"}

target:
  series_id: AMKR
  cik: "0001047127"
  name: "Amkor Technology"
  currency: USD

# ---------------------------------------------------------------------------
# Segment model (Advanced vs Mainstream products)
#
# Amkor's mix has moved from ~47% Advanced in Q1 2019 to ~81% in Q1 2026. A
# single beta fitted on total revenue averages across that drift, which is a
# plausible slice of the aggregate model's error. Modelling the two product
# groups separately and re-aggregating addresses it directly.
#
# CRITICAL - the peer-to-segment mapping below is PRE-SPECIFIED on economic
# grounds and must not be tuned by looking at fit. With 23 quarters, searching
# peer/segment/lead combinations would manufacture a confident-looking result
# out of noise. Only these mappings are fitted; anything else printed is
# labelled diagnostic and plays no part in selection.
segments:
  enabled: true
  members:
    - series_id: AMKR_ADVANCED
      name: "Advanced products"
      xbrl_member: "AdvancedProductsMember"
      # Flip chip, wafer-level and (since the reclassification) memory.
      peers: [ASE, KYEC, TSMC]
      rationale: "Advanced SiP and flip chip (ASE), advanced/HPC test (KYEC), leading-edge foundry upstream (TSMC)"
    - series_id: AMKR_MAINSTREAM
      name: "Mainstream products"
      xbrl_member: "MainstreamProductsMember"
      # All other wirebond packaging and related test.
      peers: [PTI, CHIPMOS]
      rationale: "Wirebond and memory/DDIC packaging (PTI, ChipMOS)"
  # Weighting across peers WITHIN a segment composite.
  #   equal   - each peer's normalised growth signal counts the same
  #   revenue - weight by trailing revenue (as the OSAT composite does)
  #
  # MUST be 'equal' here. These composites blend peers whose revenue differs by
  # ~70x (TSMC is roughly 69 times KYEC), so revenue weighting silently turns
  # "ASE + KYEC + TSMC" into "TSMC". In the first live run KYEC - the pure-play
  # advanced test peer, arguably the most relevant name in the set - carried 2%
  # of the signal. We are blending information, not aggregating revenue, so
  # scale is the wrong weight.
  weighting: equal
  min_weight_warn: 0.10     # warn if any peer ends up below this share
  max_weight: 0.60          # only applies when weighting: revenue
  # KNOWN AMBIGUITY: 2019 filings define Advanced as flip chip + wafer-level;
  # current filings say flip chip + memory + wafer-level. Memory was moved INTO
  # Advanced. That makes PTI (memory-heavy) arguable on either side, and it puts
  # a definitional break in the Advanced series around the reclassification.
  # Set pti_to_advanced: true to run the alternative as a sensitivity - but
  # decide on reasoning, not on which one fits better.
  pti_to_advanced: false

settings:
  history_years: 5
  scenario_z: 0.84162      # ~20th / 80th percentile band on model residuals
  min_quarters_for_fit: 12
  max_lead_months: 3
